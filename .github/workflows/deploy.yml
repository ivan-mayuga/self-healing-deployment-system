jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Runtime Dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Install Development Dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: |
          pytest -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # REPLACE THE OLD BUILD/PUSH SECTION WITH THIS
      - name: Build Docker Image
        run: |
          docker build \
            -t manavi27/self-healing-deployment-system:latest \
            -t manavi27/self-healing-deployment-system:${{ github.sha }} \
            .

      - name: Push Docker Images
        run: |
          docker push manavi27/self-healing-deployment-system:latest
          docker push manavi27/self-healing-deployment-system:${{ github.sha }}