apiVersion: apps/v1
kind: Deployment

metadata:
  name: self-healing-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: self-healing-app

  template:
    metadata:
      labels:
        app: self-healing-app

    spec:
      containers:
        - name: flask-app
          image: manavi27/self-healing-deployment-system:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
